name: Offline tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify skill and synthetic CT radar
        run: python3 -m unittest discover -s tests -v
      - name: Check CLI help
        run: python3 .claude/skills/social-content-engine/scripts/ct_radar.py --help
